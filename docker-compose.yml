version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: visualization-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: visualization
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: visualization-neo4j
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visualization-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__MySQL=Server=mysql;Port=3306;Database=visualization;User=root;Password=password123;
      - Neo4j__Uri=bolt://neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=password123
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  mysql-data:
  neo4j-data:
